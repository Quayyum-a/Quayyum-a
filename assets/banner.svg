<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quayyum — Backend and Full-Stack Engineer, founder building trust infrastructure for Lagos commerce">
  <title>Quayyum — Backend &amp; Full-Stack Engineer</title>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="300" fill="#0B0E14"/>

  <!-- ledger ruled lines -->
  <g stroke="#16202C" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="86" x2="1200" y2="86"/>
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="138" x2="1200" y2="138"/>
    <line x1="0" y1="164" x2="1200" y2="164"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="216" x2="1200" y2="216"/>
    <line x1="0" y1="242" x2="1200" y2="242"/>
    <line x1="0" y1="268" x2="1200" y2="268"/>
  </g>

  <!-- ledger margin rule (double line, as in a paper ledger book) -->
  <line x1="88" y1="0" x2="88" y2="300" stroke="#0F7A4C" stroke-width="3" opacity="0.9"/>
  <line x1="96" y1="0" x2="96" y2="300" stroke="#123425" stroke-width="1" opacity="0.6"/>

  <!-- eyebrow -->
  <text x="130" y="90" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="2" fill="#35B8A6">// backend engineer — founder</text>

  <!-- name -->
  <text x="128" y="168" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="64" font-weight="700" fill="#E9EDF2">Quayyum</text>

  <!-- blinking terminal cursor -->
  <rect x="424" y="114" width="14" height="56" fill="#E3A548">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ink-swash signature flourish -->
  <path d="M128,190 C170,208 210,205 245,188 C280,172 320,178 358,192" fill="none" stroke="#E3A548" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- tagline -->
  <text x="130" y="224" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" fill="#9AAAC0">Trust infrastructure for Lagos commerce — repair, ledgers, WhatsApp sales.</text>

  <!-- info pills -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <rect x="130" y="248" width="172" height="30" rx="15" fill="none" stroke="#2A3B4D" stroke-width="1"/>
    <text x="148" y="268" fill="#8AA0B8">📍 Lagos, Nigeria</text>

    <rect x="318" y="248" width="172" height="30" rx="15" fill="none" stroke="#1E5C41" stroke-width="1"/>
    <text x="336" y="268" fill="#35B8A6">🟢 open to work</text>
  </g>
</svg>
